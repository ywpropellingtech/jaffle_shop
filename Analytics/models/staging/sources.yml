version: 2

sources:
  - name: raw_data
    description: Raw data from Snowflake
    database: RAW_DATABASE  # Replace with your actual database name
    schema: RAW_SCHEMA      # Replace with your actual schema name
    tables:
      - name: customers
        description: Raw customer data
        columns:
          - name: customer_id
            description: Unique customer identifier
            data_type: NUMBER
            tests:
              - unique
              - not_null
          - name: customer_name
            description: Customer name
            data_type: VARCHAR
          - name: email
            description: Customer email address
            data_type: VARCHAR
          - name: created_at
            description: Account creation timestamp
            data_type: TIMESTAMP_NTZ

      - name: orders
        description: Raw order transactions
        columns:
          - name: order_id
            description: Unique order identifier
            data_type: NUMBER
            tests:
              - unique
              - not_null
          - name: customer_id
            description: Foreign key to customers table
            data_type: NUMBER
            tests:
              - not_null
              - relationships:
                  to: source('raw_data', 'customers')
                  field: customer_id
          - name: order_date
            description: Date the order was placed
            data_type: DATE
          - name: total_amount
            description: Total order amount
            data_type: NUMBER(10, 2)
          - name: status
            description: Order status (pending, completed, cancelled)
            data_type: VARCHAR

      - name: order_items
        description: Line items for each order
        columns:
          - name: order_item_id
            description: Unique order item identifier
            data_type: NUMBER
            tests:
              - unique
              - not_null
          - name: order_id
            description: Foreign key to orders table
            data_type: NUMBER
            tests:
              - not_null
          - name: product_id
            description: Foreign key to products table
            data_type: NUMBER
          - name: quantity
            description: Number of units ordered
            data_type: NUMBER
          - name: unit_price
            description: Price per unit
            data_type: NUMBER(10, 2)

  - name: legacy_data
    description: Legacy data sources (update name and schema as needed)
    database: LEGACY_DB    # Replace with your actual database name
    schema: LEGACY_SCHEMA  # Replace with your actual schema name
    tables:
      - name: legacy_customers
        description: Legacy customer records
        # Add columns as needed
