version: 2

models:
  - name: stg_customers
    description: Staging layer - cleaned customer data from Jaffle Shop
    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
      - name: first_name
        description: Customer first name
        tests:
          - not_null:
              config:
                severity: warn
      - name: last_name
        description: Customer last name
        tests:
          - not_null:
              config:
                severity: warn
      - name: loaded_at
        description: When the record was loaded into the warehouse
        tests:
          - not_null:
              config:
                severity: warn

  - name: stg_orders
    description: Staging layer - cleaned order data from Jaffle Shop
    columns:
      - name: order_id
        description: Unique order identifier
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
      - name: customer_id
        description: Reference to customer
        tests:
          - not_null:
              config:
                severity: error
      - name: order_date
        description: Date the order was placed
        tests:
          - not_null:
              config:
                severity: warn
      - name: status
        description: Order status (pending, completed, cancelled)
        tests:
          - not_null:
              config:
                severity: warn
      - name: loaded_at
        description: When the record was loaded into the warehouse
        tests:
          - not_null:
              config:
                severity: warn

  - name: stg_payments
    description: Staging layer - cleaned payment data from Stripe
    columns:
      - name: payment_id
        description: Unique payment identifier
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
      - name: order_id
        description: Reference to order
        tests:
          - not_null:
              config:
                severity: error
      - name: payment_method
        description: Payment method used (credit card, etc)
        tests:
          - not_null:
              config:
                severity: warn
      - name: status
        description: Payment status (success, failed, etc)
        tests:
          - not_null:
              config:
                severity: warn
      - name: amount_usd
        description: Payment amount in USD
        tests:
          - not_null:
              config:
                severity: error
      - name: payment_date
        description: Date payment was created
        tests:
          - not_null:
              config:
                severity: warn
      - name: batched_at
        description: When the record was batched
        tests:
          - not_null:
              config:
                severity: warn

  - name: int_customers_orders
    description: Intermediate layer - customers joined with their orders (excludes invalid status)
    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - not_null:
              config:
                severity: error
      - name: first_name
        description: Customer first name
      - name: last_name
        description: Customer last name
      - name: order_id
        description: Unique order identifier
      - name: order_date
        description: Date the order was placed
      - name: order_status
        description: Order status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ['completed', 'pending', 'cancelled', 'return', 'returned', null]
      - name: order_loaded_at
        description: When the order was loaded

  - name: int_orders_payments
    description: Intermediate layer - orders joined with payments (excludes invalid status)
    columns:
      - name: order_id
        description: Unique order identifier
        tests:
          - not_null:
              config:
                severity: error
      - name: customer_id
        description: Customer identifier
      - name: order_date
        description: Date the order was placed
      - name: order_status
        description: Order status
      - name: payment_id
        description: Unique payment identifier
      - name: payment_method
        description: Payment method used
      - name: payment_status
        description: Payment status
      - name: amount_usd
        description: Payment amount in USD
      - name: payment_date
        description: Date payment was created
      - name: batched_at
        description: When the payment was batched

  - name: mart_example
    description: Example mart model
    columns:
      - name: id
        description: Unique identifier
      - name: name
        description: Name field
