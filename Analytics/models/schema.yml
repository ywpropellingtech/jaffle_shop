version: 2

models:
  - name: stg_customers
    description: Staging layer - cleaned customer data from Jaffle Shop
    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
      - name: first_name
        description: Customer first name
        tests:
          - not_null:
              config:
                severity: warn
      - name: last_name
        description: Customer last name
        tests:
          - not_null:
              config:
                severity: warn
      - name: loaded_at
        description: When the record was loaded into the warehouse
        tests:
          - not_null:
              config:
                severity: warn

  - name: stg_orders
    description: Staging layer - cleaned order data from Jaffle Shop
    columns:
      - name: order_id
        description: Unique order identifier
      - name: customer_id
        description: Reference to customer
      - name: order_date
        description: Date the order was placed
      - name: status
        description: Order status (pending, completed, cancelled)
      - name: loaded_at
        description: When the record was loaded into the warehouse

  - name: stg_payments
    description: Staging layer - cleaned payment data from Stripe
    columns:
      - name: payment_id
        description: Unique payment identifier
      - name: order_id
        description: Reference to order
      - name: payment_method
        description: Payment method used (credit card, etc)
      - name: status
        description: Payment status (success, failed, etc)
      - name: amount_usd
        description: Payment amount in USD
      - name: payment_date
        description: Date payment was created
      - name: batched_at
        description: When the record was batched

  - name: mart_example
    description: Example mart model
    columns:
      - name: id
        description: Unique identifier
      - name: name
        description: Name field
